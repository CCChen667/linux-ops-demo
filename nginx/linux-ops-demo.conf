server {
    listen 8088 default_server;
    listen [::]:8088 default_server;

    server_name _;
    root /srv/linux-ops-demo/current/public;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/linux-ops-demo.access.log;
    error_log /var/log/nginx/linux-ops-demo.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /health {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","service":"linux-ops-demo"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
